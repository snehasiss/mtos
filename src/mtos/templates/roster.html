<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf }}"><title>MTOS · Asset Manager</title>
<link rel="stylesheet" href="{{ url_for('static',filename='roster.css') }}">
<script defer src="{{ url_for('static',filename='roster.js') }}"></script></head>
<body><header><a href="/" class="brand"><img class="brand-logo" src="{{ url_for('static',filename='mtos-logo-wireframe.png') }}" alt=""><span class="brand-copy"><b>MTOS</b><small>Model Train Operating System</small></span></a></header>
<main><section id="library"><div class="title"><div><p class="eyebrow">YOUR COLLECTION</p><h1>Asset library</h1></div><button id="add">+ Add asset</button></div>
<div class="filters"><label>Search<input id="search" type="search" placeholder="ID, reporting mark, road number…"></label>
<label>Family<select id="filter-family"><option value="">All families</option></select></label>
<label>Status<select id="filter-status"><option value="">All statuses</option></select></label></div>
<p id="summary" aria-live="polite"></p><div id="cards" class="cards"></div>
<nav class="pages" aria-label="Asset pages"><button id="previous" aria-label="Previous page">←</button><button id="next" aria-label="Next page">→</button></nav>
<details><summary>Saved consists</summary><div id="consists"></div><form id="consist-form">
<label>Consist ID<input name="id" placeholder="K001" pattern="K[0-9]{3}" required></label>
<label>Label<input name="label"></label><label>Units, lead first<input name="units" placeholder="L001, L002" required></label>
<input type="hidden" name="revision"><button>Save consist</button><button type="button" id="new-consist">New consist</button></form></details></section>
<section id="editor" hidden><div class="editor-heading"><button id="back" class="secondary">← Library</button><h1 id="editor-title">Add asset</h1><button id="edit-toggle" type="button" class="secondary">Edit Asset</button></div>
<p id="detail-status" class="status-line" role="status" aria-live="polite">View mode · fields are protected from accidental changes.</p>
<form id="asset-form">
<fieldset><legend>Identity</legend><div class="fields">
<label>Asset ID<input name="id" placeholder="L001" pattern="[A-Z][0-9]{3}" required></label>
<label>Family<select name="family" required></select></label><label>Type<select name="type" required></select></label>
<label>Label (optional)<input name="label"></label></div></fieldset>
<fieldset><legend>Prototype · real-world subject</legend><div class="fields">
<label>Reporting mark<input name="reporting_mark" placeholder="UP"></label><label>Road number<input name="road_number" placeholder="3826"></label>
<label>Builder<input name="prototype_maker"></label><label>Model<input name="prototype_model"></label></div></fieldset>
<fieldset><legend>Scale model</legend><div class="fields"><label>Scale<input name="scale" placeholder="ho"></label>
<label>Maker<input name="model_maker"></label><label>Product number<input name="product_number"></label><label>Catalog name<input name="catalog_name"></label></div></fieldset>
<fieldset><legend>Lifecycle</legend><div class="fields"><label>Possession<select name="possession"></select></label>
<label>Status<select name="status"></select></label>
<label>Location<select name="location"></select></label>
<label>Purchased on<input name="purchased_on" type="date"></label>
<label>Purchase source<input name="source"></label><label>Price<input name="price" type="number" min="0" step="0.01"></label></div></fieldset>
<fieldset><legend>Control configuration</legend><div class="fields"><label class="check"><input type="checkbox" name="dcc"> DCC equipped</label>
<label>DCC address<input name="address" type="number" min="1"></label>
<label>Decoder maker<select name="decoder_maker"><option value="">Not specified</option></select></label>
<label>Decoder model<input name="decoder_model" class="decoder-model" placeholder="loksound_5"></label><label class="check"><input type="checkbox" name="sound"> Sound equipped</label>
<label>Accessory node<input name="node_id" placeholder="N001" pattern="N[0-9]{3}"></label></div></fieldset>
<label>Notes<textarea name="notes" rows="3"></textarea></label>
<div class="save"><button type="submit">Save asset</button></div></form>
<section id="photos" hidden><h2>Photos</h2><div id="gallery" class="gallery"></div>
<form id="image-form"><label>Choose photo<input name="image" type="file" accept="image/*" required></label>
<button>Upload photo</button></form></section>
</section><p id="error" role="alert"></p></main><footer>MTOS · Asset management</footer></body></html>
