<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">MTOS asset control component connections</title>
  <desc id="desc">The Cubietruck controls an EX-CSB1 through USB serial and an ESP32 accessory node through MQTT over Wi-Fi. A 12 volt bus feeds an XL4015 converter. The ESP32 controls SG90 turnout servos through a PCA9685 and signal LEDs through cascaded 74HC595 shift registers. Machines use an electrically appropriate isolated relay or driver.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.group{fill:#fff;stroke:#9b8c78;stroke-width:2}.core{fill:#dcefdc;stroke:#14675f;stroke-width:3}.device{fill:#edf4f2;stroke:#315f5a;stroke-width:2}.power{fill:#fff1d6;stroke:#bd7c18;stroke-width:2}.load{fill:#f5eadb;stroke:#855f37;stroke-width:2}.label{font:700 18px Inter,Arial,sans-serif;fill:#203330}.small{font:14px Inter,Arial,sans-serif;fill:#455a56}.tiny{font:12px Inter,Arial,sans-serif;fill:#5b6865}.wire{fill:none;stroke:#315f5a;stroke-width:3;marker-end:url(#arrow)}.logicwire{fill:none;stroke:#72509b;stroke-width:2.5;marker-end:url(#logicarrow)}.powerwire{fill:none;stroke:#c07913;stroke-width:4;marker-end:url(#powerarrow)}.ground{fill:none;stroke:#596963;stroke-width:2;stroke-dasharray:7 5}.radio{fill:none;stroke:#287eaa;stroke-width:3;stroke-dasharray:9 5;marker-end:url(#bluearrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f5a"/></marker>
    <marker id="powerarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#c07913"/></marker>
    <marker id="bluearrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#287eaa"/></marker>
    <marker id="logicarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#72509b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="820"/>
  <text class="label" x="40" y="38">MTOS asset_control — physical and logical connections</text>
  <text class="small" x="40" y="62">Component overview — not a pin-level wiring schematic; shared SQLite configuration; local node grounding</text>

  <rect class="group" x="30" y="85" width="1140" height="190" rx="12"/>
  <text class="label" x="50" y="115">Rolling-stock DCC control — synchronous and immediate</text>
  <rect class="core" x="65" y="145" width="205" height="82" rx="8"/>
  <text class="label" x="85" y="178">Cubietruck A20</text>
  <text class="small" x="85" y="202">asset_control :5302</text>
  <rect class="power" x="65" y="238" width="205" height="25" rx="5"/>
  <text class="tiny" x="101" y="255">Dedicated 5 V / 2 A</text>
  <rect class="device" x="390" y="145" width="205" height="82" rx="8"/>
  <text class="label" x="438" y="178">EX-CSB1</text>
  <text class="small" x="420" y="202">DCC-EX command station</text>
  <rect class="power" x="390" y="238" width="205" height="25" rx="5"/>
  <text class="tiny" x="435" y="255">Dedicated 15 V / 6 A</text>
  <rect class="load" x="725" y="145" width="175" height="82" rx="8"/>
  <text class="label" x="771" y="178">MAIN</text>
  <text class="small" x="746" y="202">current test track</text>
  <rect class="load" x="960" y="145" width="175" height="82" rx="8"/>
  <text class="label" x="1008" y="178">PROG</text>
  <text class="small" x="978" y="202">parked / not wired</text>
  <path class="wire" d="M270 182 H390"/>
  <text class="tiny" x="298" y="171">USB serial</text>
  <path class="powerwire" d="M595 183 H725"/>
  <text class="tiny" x="627" y="171">DCC output</text>
  <path class="ground" d="M595 218 H665 V132 H1040 V145"/>
  <text class="tiny" x="735" y="128">Separate PROG output — future isolated track</text>

  <rect class="group" x="30" y="295" width="1140" height="485" rx="12"/>
  <text class="label" x="50" y="327">Stationary-asset control — asynchronous, queued, sequenced</text>
  <rect class="core" x="65" y="360" width="205" height="92" rx="8"/>
  <text class="label" x="85" y="392">Cubietruck A20</text>
  <text class="small" x="85" y="416">scheduler + Mosquitto</text>
  <text class="tiny" x="85" y="437">SQLite command state</text>
  <rect class="device" x="390" y="350" width="220" height="112" rx="8"/>
  <text class="label" x="442" y="382">ESP32 N001</text>
  <text class="small" x="413" y="406">node firmware + asset map</text>
  <text class="tiny" x="413" y="429">turnout → PCA channel</text>
  <text class="tiny" x="413" y="447">signal aspect → 74HC595 Q</text>
  <path class="radio" d="M270 405 H390"/>
  <text class="tiny" x="295" y="390">Wi-Fi / MQTT</text>

  <rect class="power" x="65" y="520" width="205" height="76" rx="8"/>
  <text class="label" x="94" y="550">12 V accessory bus</text>
  <text class="small" x="102" y="574">fused node branch</text>
  <rect class="power" x="390" y="520" width="220" height="76" rx="8"/>
  <text class="label" x="452" y="550">XL4015</text>
  <text class="small" x="426" y="574">12 V DC → regulated 5 V</text>
  <path class="powerwire" d="M270 558 H390"/>

  <rect class="device" x="700" y="335" width="205" height="98" rx="8"/>
  <text class="label" x="756" y="366">PCA9685</text>
  <text class="small" x="729" y="390">servo PWM only, 50 Hz</text>
  <text class="tiny" x="725" y="413">VCC 3.3 V · V+ 5 V</text>
  <rect class="load" x="980" y="335" width="155" height="98" rx="8"/>
  <text class="label" x="1020" y="368">SG90</text>
  <text class="small" x="997" y="392">turnout servo(s)</text>
  <text class="tiny" x="998" y="414">SL-90 uses two</text>
  <path class="wire" d="M610 380 H700"/>
  <text class="tiny" x="628" y="366">I²C</text>
  <path class="wire" d="M905 383 H980"/>
  <text class="tiny" x="916" y="369">PWM</text>

  <rect class="device" x="700" y="465" width="205" height="98" rx="8"/>
  <text class="label" x="736" y="496">74HC595 chain</text>
  <text class="small" x="722" y="520">signal shift registers</text>
  <text class="tiny" x="724" y="543">3.3 V · data / clock / latch / OE</text>
  <rect class="load" x="980" y="465" width="155" height="98" rx="8"/>
  <text class="label" x="990" y="496">Signals / buffers</text>
  <text class="small" x="988" y="520">one Q per LED</text>
  <text class="tiny" x="988" y="543">resistor · local buffer flash</text>
  <path class="wire" d="M610 435 H625 V510 H700"/>
  <path class="wire" d="M905 513 H980"/>
  <text class="tiny" x="925" y="500">Q0…Q7</text>

  <rect class="device" x="700" y="600" width="205" height="98" rx="8"/>
  <text class="label" x="738" y="631">Relay driver</text>
  <text class="small" x="720" y="655">GPIO · transistor · flyback</text>
  <text class="tiny" x="721" y="678">isolated NO contact</text>
  <rect class="load" x="980" y="600" width="155" height="98" rx="8"/>
  <text class="label" x="1012" y="631">BLI 7924</text>
  <text class="small" x="996" y="655">relay across pushbutton</text>
  <text class="tiny" x="1014" y="678">fused native 12 V</text>
  <path class="wire" d="M610 445 H620 V645 H700"/>
  <path class="wire" d="M905 649 H980"/>

  <path class="powerwire" d="M610 558 H650 V414 H700"/>
  <path class="powerwire" d="M610 577 H635 V451 H505 V462"/>
  <text class="tiny" x="617" y="602">5 V rail to ESP32 VIN and servo V+</text>
  <path class="logicwire" d="M505 462 V487 H700"/>
  <text class="tiny" x="536" y="480">ESP32 3.3 V logic</text>
  <path class="powerwire" d="M270 575 H320 V732 H955 V650 H980"/>
  <text class="tiny" x="339" y="749">separate fused 12 V machine branch where required</text>

  <path class="ground" d="M390 720 H905"/>
  <path class="ground" d="M500 596 V720 M802 433 V720 M802 563 V720 M802 698 V720"/>
  <text class="tiny" x="520" y="714">common node ground: XL4015 · ESP32 · PCA9685 · 74HC595 · drivers</text>
  <text class="tiny" x="40" y="802">Assembly details pending: GPIO/pins, OE/reset defaults, decoupling, LED polarity/resistors, connectors and measured branch fuses.</text>
</svg>
