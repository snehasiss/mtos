[project]
name = "mtos"
version = "0.1.0"
description = "Model Train Operating System"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "Flask>=3.1,<4", "waitress>=3,<4", "pyserial>=3.5,<4", "Flask-SocketIO>=5.5,<6", "simple-websocket>=1.1,<2"]

[project.scripts]
mtos_backup = "mtos.backup:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtos = ["templates/*.html", "static/*", "control_ui/*", "control_ui/assets/*", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
